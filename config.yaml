# kurzgeschrieben config
#
# Secrets do NOT go in this file — the API key is read from the environment
# (see .env.example). This file is safe to commit.
#
# Model slugs use OpenRouter's provider/model format. Browse the catalog at
# https://openrouter.ai/models — a few useful swaps:
#   google/gemini-2.5-flash        (cheap + fast, current default)
#   anthropic/claude-sonnet-4.5    (much stronger, more expensive)
#   openai/gpt-5                   (comparable to sonnet, different voice)
#   google/gemini-2.5-pro          (stronger Gemini, still cheap-ish)

llm:
  model: google/gemini-2.5-flash
  temperature: 0.3
  # max_tokens: 4096   # uncomment to cap completion length

summarize:
  # Available styles:
  #   wiki_lede     — opening section only (1-3 short paragraphs)
  #   wiki_article  — full article with lede + `## Section` body headings
  default_style: wiki_lede

web:
  # Controls the "Regenerate" button in the local web UI.
  # Leave this on while you're iterating on prompts yourself.
  # Turn it OFF before sharing the app with other people, otherwise they can
  # spend your API credits by spamming regenerate.
  allow_regenerate: true
